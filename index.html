<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>清華簡《筮法》查驗器 v0.1</title>
<style>
:root{
  --pith:#E3DDC6;      /* 竹黃 */
  --pith-2:#D6CFB2;
  --ink:#1F1B16;
  --ink-2:#4A4238;
  --zhu:#A8322A;       /* 朱 — 惡爻／凶 */
  --qing:#2E5A66;      /* 石青 — 出處標記 */
  --zhuqing:#5E6E42;   /* 竹青 — 常爻／吉 */
  --rule:#B3AA8A;
  --pale:#EFEADB;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--pith);
  color:var(--ink);
  font-family:"Noto Serif TC","Songti TC","STSong","SimSun",serif;
  line-height:1.75;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:1.5rem;margin:0 0 2px;letter-spacing:.12em;font-weight:700}
.sub{font-size:.82rem;color:var(--ink-2);letter-spacing:.04em;margin-bottom:18px}
h2{font-size:1.06rem;margin:26px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--rule);letter-spacing:.08em}
h3{font-size:.94rem;margin:16px 0 6px;letter-spacing:.06em}
p{margin:.5em 0}
small{font-size:.78rem;color:var(--ink-2)}

nav{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:18px;border-bottom:2px solid var(--ink);padding-bottom:0}
nav button{
  font-family:inherit;font-size:.86rem;letter-spacing:.08em;
  background:transparent;border:1px solid var(--rule);border-bottom:none;
  color:var(--ink-2);padding:7px 12px;cursor:pointer;border-radius:2px 2px 0 0;
}
nav button[aria-selected="true"]{background:var(--ink);color:var(--pith);border-color:var(--ink)}
nav button:focus-visible{outline:2px solid var(--zhu);outline-offset:1px}
section[hidden]{display:none}

.card{background:var(--pale);border:1px solid var(--rule);padding:14px;margin:12px 0}

/* ── 招牌：四位竹簡格 ── */
.siwei{
  display:grid;grid-template-columns:1fr 1fr;gap:2px;
  background:var(--ink);border:2px solid var(--ink);
  max-width:420px;margin:10px auto;
}
.wei{background:var(--pale);padding:10px 6px;text-align:center;position:relative}
.wei .lab{font-size:.7rem;letter-spacing:.14em;color:var(--ink-2);display:block;margin-bottom:6px}
.wei .gua{font-size:1.5rem;letter-spacing:.1em;margin-top:6px;min-height:1.6em}
.wei .gua small{display:block;font-size:.68rem;letter-spacing:.1em}
.yao{display:flex;flex-direction:column-reverse;align-items:center;gap:3px}
.yao select{
  font-family:"Menlo","Consolas",monospace;font-size:1.15rem;
  width:2.6em;text-align:center;padding:2px 0;
  background:var(--pith);color:var(--ink);
  border:1px solid var(--rule);border-radius:2px;
}
.yao select.e{color:var(--zhu);border-color:var(--zhu);font-weight:700}
.yao .pos{font-size:.62rem;color:var(--ink-2)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
label{font-size:.84rem;letter-spacing:.05em}
select.big,input.big{font-family:inherit;font-size:.88rem;padding:5px 8px;background:var(--pale);border:1px solid var(--rule);color:var(--ink)}
button.act{
  font-family:inherit;font-size:.88rem;letter-spacing:.1em;
  background:var(--ink);color:var(--pith);border:none;padding:8px 18px;cursor:pointer;
}
button.act.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}

/* ── 判準結果 ── */
.hit{border-left:3px solid var(--zhuqing);padding:6px 10px;margin:6px 0;background:var(--pale)}
.hit.no{border-left-color:var(--rule);opacity:.5}
.hit b{letter-spacing:.08em}
.hit .why{display:block;font-size:.78rem;color:var(--ink-2)}

/* ── 出處／狀態標記 ── */
.tag{font-size:.66rem;letter-spacing:.08em;padding:1px 5px;border:1px solid;border-radius:2px;white-space:nowrap;margin-left:5px;vertical-align:.12em}
.t-src{color:var(--qing);border-color:var(--qing)}
.t-orig{color:var(--zhuqing);border-color:var(--zhuqing)}
.t-warn{color:var(--zhu);border-color:var(--zhu);background:#F7E9E6}

table{border-collapse:collapse;width:100%;font-size:.84rem;margin:8px 0}
th,td{border:1px solid var(--rule);padding:5px 7px;text-align:center}
th{background:var(--pith-2);font-weight:400;letter-spacing:.06em}
td.l,th.l{text-align:left}
.num{font-family:"Menlo","Consolas",monospace}
.zhu{color:var(--zhu)}
.qing{color:var(--qing)}
ul{padding-left:1.3em;margin:.4em 0}
li{margin:.2em 0}
.ok{color:var(--zhuqing)}
.bad{color:var(--zhu);font-weight:700}
details{margin:8px 0;border:1px solid var(--rule);padding:8px 10px;background:var(--pale)}
summary{cursor:pointer;font-size:.88rem;letter-spacing:.06em}
.mono{font-family:"Menlo","Consolas",monospace}
@media (max-width:520px){
  .wrap{padding:14px 10px 60px}
  .wei .gua{font-size:1.25rem}
  .yao select{font-size:1rem;width:2.4em}
}
@media (prefers-reduced-motion:no-preference){
  .hit{animation:fade .18s ease-out}
  @keyframes fade{from{opacity:0}to{opacity:1}}
}
</style>
</head>
<body>
<div class="wrap">
<h1>清華簡《筮法》查驗器</h1>
<div class="sub">v0.1　戰國非《周易》占筮系統　四位・十七命・卦位圖　—　只查驗，不起卦</div>

<nav role="tablist">
  <button role="tab" aria-selected="true" data-t="t1">查驗</button>
  <button role="tab" aria-selected="false" data-t="t2">卦例</button>
  <button role="tab" aria-selected="false" data-t="t3">查表</button>
  <button role="tab" aria-selected="false" data-t="t4">成卦</button>
  <button role="tab" aria-selected="false" data-t="t5">文獻</button>
  <button role="tab" aria-selected="false" data-t="t6">自檢</button>
</nav>

<!-- ═══ 查驗 ═══ -->
<section id="t1">
  <div class="card">
    <p style="margin-top:0"><small>填入十二筮數（四位 × 三爻，值域四五六七八九）。七在簡上書作「一」。<span class="zhu">四五八九</span>為惡爻，顯朱色。</small></p>
    <div class="siwei" id="grid"></div>
    <div class="row">
      <label>季節 <select class="big" id="season"><option value="春">春</option><option value="夏">夏</option><option value="秋">秋</option><option value="冬">冬</option></select></label>
      <label>命 <select class="big" id="ming"></select></label>
      <label>稱謂 <select class="big" id="reg">
        <option value="軍旅">軍旅</option><option value="家人">家人</option>
        <option value="爵位">爵位</option><option value="宮室">宮室</option></select></label>
      <button class="act" id="run">查驗</button>
      <button class="act ghost" id="demo">載入示例</button>
    </div>
  </div>
  <div id="out"></div>
</section>

<!-- ═══ 卦例 ═══ -->
<section id="t2" hidden>
  <h2>五十七卦例</h2>
  <p><small>筮辭與節次已備，<b>十二筮數尚缺</b>——原書卦畫為圖，未取得逐例數字。空殼已建，數字欄留空；補入後即可回驗規則層。</small></p>
  <div class="card">
    <h3 style="margin-top:0">反查</h3>
    <div class="row">
      <label>判準 <select class="big" id="rq"></select></label>
      <button class="act" id="rqrun">列出符合之卦例</button>
    </div>
    <div id="rqout"><small>接口已備，待筮數填入後生效。</small></div>
  </div>
  <div id="lieout"></div>
</section>

<!-- ═══ 查表 ═══ -->
<section id="t3" hidden><div id="tblout"></div></section>

<!-- ═══ 成卦 ═══ -->
<section id="t4" hidden><div id="chengua"></div></section>

<!-- ═══ 文獻 ═══ -->
<section id="t5" hidden><div id="wenxian"></div></section>

<!-- ═══ 自檢 ═══ -->
<section id="t6" hidden><div id="selfout"></div></section>
</div>

<script>
"use strict";
/* ════════════════════════════════════════════════════════
   清華簡《筮法》查驗器 v0.1
   底本層級：現用者非最善之本。
     甲 中西書局《清華大學藏戰國竹簡（肆）》2013（未取得，最終校訂待補）
     乙 子居〈清華簡《筮法》解析（修訂稿上／下）〉— 逐條引錄整理者原註並標中西書局頁碼
     丙 沈建華〈《筮法》果占與商代占卜淵源〉（清華大學出土文獻中心）
     丁 李學勤〈《筮法》《別卦》與《算表》〉（成果發布會講話，中國文化報 2014-01-14）
     戊 易學網 Jack 全文註解（繁體工作本；站主自陳與原書不盡一致，且有逕改之字）
   凡非原文者，一律標記。
   ════════════════════════════════════════════════════════ */

/* ── 出處／狀態標記 ── */
const SRC={ZLZ:"整理者",LXQ:"李學勤",LMC:"廖名春",MN:"馬楠",ZJ:"子居",SJH:"沈建華",YXW:"易學網",LGS:"劉光勝",CH:"程浩",JLX:"賈連翔",LB:"劉彬",LZJ:"林忠軍",CRH:"陳睿宏",LJP:"劉佳佩",ENG:"本引擎實測"};
function tag(t,cls){return `<span class="tag ${cls||'t-src'}">${t}</span>`;}
const T_ORIG=tag("原文","t-orig"), T_BU=tag("整理者補","t-warn"),
      T_YI=tag("異說","t-warn"), T_CUN=tag("存疑","t-warn"), T_WEI=tag("未能通解","t-warn");

/* ── 爻 ── */
const NUMS=[4,5,6,7,8,9];
const YANG=new Set([7,5,9]), YIN=new Set([6,4,8]);
const CHANG=new Set([6,7]), E=new Set([4,5,8,9]);   // 常爻／惡爻（「亞肴」，第一節簡文）
const NUMCH={4:"四",5:"五",6:"六",7:"七",8:"八",9:"九"};
function isYang(n){return YANG.has(n);}

/* ── 八經卦：由三爻奇偶定。卦名用《筮法》原名 ── */
const GUA={
  "乾":{k:[1,1,1],sym:"☰",tong:"乾",xing:"男",bie:"父"},
  "坤":{k:[0,0,0],sym:"☷",tong:"坤",xing:"女",bie:"母"},
  "艮":{k:[0,0,1],sym:"☶",tong:"艮",xing:"男",bie:"少男"},
  "兌":{k:[1,1,0],sym:"☱",tong:"兌",xing:"女",bie:"少女"},
  "勞":{k:[0,1,0],sym:"☵",tong:"坎",xing:"男",bie:"中男"},
  "羅":{k:[1,0,1],sym:"☲",tong:"離",xing:"女",bie:"中女"},
  "震":{k:[1,0,0],sym:"☳",tong:"震",xing:"男",bie:"長男"},
  "巽":{k:[0,1,1],sym:"☴",tong:"巽",xing:"女",bie:"長女"}
};
// 卦序依第二十五節〈天干與卦〉、第二十六節〈祟〉所用之序，與輯本《歸藏·初經》同（劉光勝）
// k = [下爻,中爻,上爻]，1 陽 0 陰
function guaOf(y){ // y=[下,中,上] 之筮數
  const k=y.map(n=>isYang(n)?1:0);
  for(const g in GUA){const a=GUA[g].k;if(a[0]===k[0]&&a[1]===k[1]&&a[2]===k[2])return g;}
  return null;
}

/* ── 四位座標 ── */
const WEI=["左上","右上","左下","右下"];
const AXIS={  // 據第二十節〈四位表〉原表
  "右下":{nei:"內",zun:"卑位側",note:"內・身・主"},
  "左上":{nei:"外",zun:"卑位側",note:"外・彼・客"},
  "右上":{nei:"內側",zun:"尊",note:"尊・貴"},
  "左下":{nei:"外側",zun:"卑",note:"卑・賤"}
};
const REG={ // 四套稱謂，同一組座標
  "軍旅":{"左上":"下軍","右上":"上軍","左下":"次軍","右下":"中軍"},
  "家人":{"左上":"臣妾","右上":"子眚（子姓）","左下":"妻","右下":"躬身"},
  "爵位":{"左上":"臣","右上":"君","左下":"大夫","右下":"身"},
  "宮室":{"左上":"外","右上":"門","左下":"宮廷","右下":"室"}
};

/* ── 四季吉凶（第二十一節） ── */
const SEASON={
  "春":{"大吉":["震","巽"],"小吉":["勞"],"大凶":["艮","羅"],"小凶":["兌"],bu:[]},
  "夏":{"大吉":["勞"],"小吉":["震","巽"],"大凶":["兌"],"小凶":["艮","羅"],bu:[]},
  "秋":{"大吉":["兌"],"小吉":["艮","羅"],"大凶":["勞"],"小凶":["震","巽"],bu:["小凶"]},
  "冬":{"大吉":["艮","羅"],"小吉":["兌"],"大凶":["震","巽"],"小凶":["勞"],bu:["小凶"]}
};
function jixiong(g,s){const t=SEASON[s];for(const k of["大吉","小吉","大凶","小凶"])if(t[k].includes(g))return k;return null;}
function isJi(k){return k==="大吉"||k==="小吉";}

/* ── 干支配卦・配爻（第二十五・二十七・二十八節） ── */
const GAN={"乾":["甲","壬"],"坤":["乙","癸"],"艮":["丙"],"兌":["丁"],"勞":["戊"],"羅":["己"],"震":["庚"],"巽":["辛"]};
const ZHI_GUA={"震":["子","午"],"巽":["丑","未"],"勞":["寅","申"],"羅":["卯","酉"],"艮":["辰","戌"],"兌":["巳","亥"]};
const ZHI_YAO={9:["子","午"],8:["丑","未"],7:["寅","申"],6:["卯","酉"],5:["辰","戌"],4:["巳","亥"]};
const NUM_GUA={9:"震",8:"巽",7:"勞",6:"羅",5:"艮",4:"兌"}; // 兩表疊合所得

/* ── 五行（第二十四節卦位圖・第十一節） ── */
const WUXING={"震":"木","巽":"木","勞":"火","兌":"金","艮":"水","羅":"水","乾":null,"坤":null};
const FANG={"震":"東","巽":"東南","勞":"南","兌":"西","艮":"東北","羅":"北","乾":"西北","坤":"西南"};

/* ── 爻象（第二十九節） ── */
const YAOXIANG={
  8:{xiang:["風","水","言","飛鳥","瘇脹","魚","權㣚"],shang:"醪",xia:"汰",
     zhu:"「權㣚」整理者暫釋「罐筩」；子居讀「權重」。在上／在下二物整理者試釋為醪、汰。"},
  5:{xiang:["天","日","貴人","兵","血","車","方","憂懼","饑"],
     zhu:"末字整理者疑讀「饑」；子居讀「𢜽」（悸）。"},
  9:{xiang:["大獸","木","備戒","首","足","蛇","曲","玦","弓琥璜"],
     zhu:"原有「為它」二字，整理者判為衍文。"},
  4:{xiang:["地","圓","鼓","珥","環","腫","雪","露","霰"],
     zhu:"「腫」整理者暫釋「踵」；子居以為八象已有瘇脹（水腫），此當為肉腫，取象不同。"}
};

/* ── 祟（第二十六節） ── */
const SUI={
  "乾":[["純","滅宗"],["五","滅宗"],["殽","父之不葬死"],["莫純","室中、父"],["九","乃山"]],
  "坤":[["恆","門、行"],["純","乃母"],["八","伊以死、西祭"],["四","乃縊者"]],
  "艮":[["恆","施"],["九","乃豦"],["五","乃椳狊"]],
  "兌":[["恆","女子大面端虩死；長女為妾而死"]],
  "勞":[["恆","風、長殤"],["五","伏劍者"],["九","牡豦"],["四","縊者"],["一四一五","乃辜者"]],
  "羅":[["恆","熱、溺者"],["四","縊者"],["一四一五","長女殤"],["二五夾四","辜者"]],
  "震":[["恆","日出→東方；𢓀日→監天；昃日→昊天；暮日→雨師"],["五","乃狂者"],["九","乃戶"]],
  "巽":[["恆","字殤"],["五","乃巫"],["八","乃巫"],["九","柆幼子"],["四","非狂乃縊者"]]
};
const SUI_FU="夫天之道，男勝女，眾勝寡。（整理者：此語附抄於此）";

/* ── 十七命（第三十節） ── */
const MING=["果","至","享","死生","得","見","瘳","咎","男女","雨","娶妻","戰","成","行","讎","旱","祟"];
const MING_NOTE="整理者本此處僅列十六條，無「享」；沈建華所引本有「曰亯（享）」足十七。整理者自註：十七命皆有相當簡文，惟簡文將「雨」「旱」合在一節，另有一節不見於十七命之中。";

/* ── 命 ⇄ 節（多對多） ── */
const MING_JIE={
  "死生":[1],"得":[2,15],"享":[3],"至":[5],"娶妻":[6],"讎":[7],"見":[8],"咎":[9],
  "瘳":[10],"雨":[11],"旱":[11],"男女":[12],"行":[13],"戰":[16],"成":[17],"果":[23],"祟":[26]
};

/* ════════ 判準層 ════════
   每條回傳 {ok, why}。分五類。 */
function pos(st){ // st = {左上:[y],...}
  const g={}; WEI.forEach(w=>g[w]=guaOf(st[w])); return g;
}
const LEFT=new Set(["巽","震","艮","羅"]), RIGHT=new Set(["勞","坤","兌","乾"]);
const PAIR={"乾":"坤","坤":"乾","震":"巽","巽":"震","勞":"羅","羅":"勞","艮":"兌","兌":"艮"};
const SIZHENG=new Set(["震","羅","勞","兌"]);

const RULES=[
 {id:"三左同右",cls:"卦身",fn:(g)=>{const L=WEI.filter(w=>LEFT.has(g[w]));
   return {ok:L.length===3,why:`左卦 ${L.length} 個（依卦位圖左右之分）`};}},
 {id:"三右同左",cls:"卦身",fn:(g)=>{const R=WEI.filter(w=>RIGHT.has(g[w]));
   return {ok:R.length===3,why:`右卦 ${R.length} 個`};}},
 {id:"三男同女",cls:"卦身",fn:(g)=>{const M=WEI.filter(w=>GUA[g[w]].xing==="男");
   return {ok:M.length===3,why:`男卦 ${M.length}：${M.map(w=>g[w]).join("")}`};}},
 {id:"三女同男",cls:"卦身",fn:(g)=>{const F=WEI.filter(w=>GUA[g[w]].xing==="女");
   return {ok:F.length===3,why:`女卦 ${F.length}：${F.map(w=>g[w]).join("")}`};}},
 {id:"相見在上",cls:"卦身",fn:(g)=>({ok:PAIR[g["左上"]]===g["右上"],
   why:`上位 左${g["左上"]}・右${g["右上"]}${PAIR[g["左上"]]===g["右上"]?"，配偶相對":"，不成對"}`})},
 {id:"妻夫相見",cls:"卦身",fn:(g)=>{
   const ps=[["左上","右上"],["左下","右下"],["左上","左下"],["右上","右下"]]
     .filter(([a,b])=>PAIR[g[a]]===g[b]);
   return {ok:ps.length>0,why:ps.length?ps.map(([a,b])=>`${a}${g[a]}⇄${b}${g[b]}`).join("；"):"無相鄰配偶對"};}},
 {id:"數出（兌在右上）",cls:"位置",fn:(g)=>({ok:g["右上"]==="兌",why:`右上為 ${g["右上"]}`})},
 {id:"數內（兌在左上）",cls:"位置",fn:(g)=>({ok:g["左上"]==="兌",why:`左上為 ${g["左上"]}`})},
 {id:"至：四正之卦見",cls:"卦身",fn:(g)=>{const s=WEI.filter(w=>SIZHENG.has(g[w]));
   return {ok:s.length>0,why:s.length?`四正卦 ${s.map(w=>g[w]).join("")}`:"四位皆四隅卦"};}},
 {id:"六虛",cls:"爻位",fn:(g,st)=>{
   // 整理者：合觀左右，六爻之位皆有陽爻
   let all=true,d=[];
   for(let i=0;i<3;i++){
     const a=isYang(st["左下"][i]),b=isYang(st["右下"][i]);
     if(!(a||b))all=false; d.push((a||b)?"有":"無");
   }
   for(let i=0;i<3;i++){
     const a=isYang(st["左上"][i]),b=isYang(st["右上"][i]);
     if(!(a||b))all=false; d.push((a||b)?"有":"無");
   }
   return {ok:all,why:`六位有陽：${d.join("・")}`};}},
 {id:"同次（四位次爻相同）",cls:"爻位",fn:(g,st)=>{
   const m=WEI.map(w=>isYang(st[w][1]));
   const ok=m.every(x=>x===m[0]);
   return {ok,why:`四位中爻 ${WEI.map(w=>NUMCH[st[w][1]]).join("・")}${ok?"，陰陽一致":"，不一致"}`};}},
 {id:"成：中心四爻同",cls:"爻位",fn:(g,st)=>{
   const c=[st["左下"][2],st["左上"][0],st["右下"][2],st["右上"][0]];
   const ok=c.every(x=>x===c[0]);
   return {ok,why:`中心四爻 ${c.map(x=>NUMCH[x]).join("・")}${ok?"，同":"，不同"}`};}},
 {id:"男女：上去二下去一",cls:"爻位",fn:(g,st)=>{
   // 右方：上卦去自上二爻（留下爻），下卦去自下一爻（留中上爻）→ 中間三爻成卦
   const R=[st["右下"][1],st["右下"][2],st["右上"][0]];
   const L=[st["左下"][1],st["左下"][2],st["左上"][0]];
   const gr=guaOf(R),gl=guaOf(L);
   const same=GUA[gr].xing===GUA[gl].xing;
   return {ok:same,why:`右得 ${gr}（${GUA[gr].bie}）・左得 ${gl}（${GUA[gl].bie}）${same?"　→ 乃"+GUA[gr].xing:"　→ 左右異，原書未言"}`};}},
 {id:"惡爻居之",cls:"爻位",fn:(g,st)=>{
   const hit=[];WEI.forEach(w=>st[w].forEach((n,i)=>{if(E.has(n))hit.push(`${w}${["下","中","上"][i]}爻${NUMCH[n]}`)}));
   return {ok:hit.length>0,why:hit.length?hit.join("、"):"四位皆常爻"};}}
];

/* 四季吉凶合議：三吉同凶 等 */
function jiCount(g,s){
  const r=WEI.map(w=>({w,g:g[w],k:jixiong(g[w],s)}));
  const ji=r.filter(x=>x.k&&isJi(x.k)), xiong=r.filter(x=>x.k&&!isJi(x.k)), non=r.filter(x=>!x.k);
  return {r,ji,xiong,non};
}

  const reg=document.getElementById("reg").value;
  WEI.forEach(w=>{

      `${GUA[g].sym} ${g}<small>${GUA[g].bie}・${GUA[g].tong!==g?"通行作"+GUA[g].tong:"　"}</small>`;

  document.querySelectorAll('.yao select').forEach(s=>{
    const v=+s.value; s.classList.toggle("e",E.has(v)); s.value=v;

function run(){
  const s=document.getElementById("season").value;
  const m=document.getElementById("ming").value;
  const reg=document.getElementById("reg").value;
  const g=pos(state);
  let h=`<h2>判斷</h2>`;

  // 一、四位
  h+=`<div class="card"><h3 style="margin-top:0">四位</h3><table><tr><th>位</th><th>${reg}</th><th>卦</th><th>別</th><th>五行</th><th>方</th><th>四季（${s}）</th></tr>`;
  WEI.forEach(w=>{
    const k=jixiong(g[w],s);
    const bu=k&&SEASON[s].bu.includes(k);
    h+=`<tr><td>${w}<br><small>${AXIS[w].note}</small></td><td>${REG[reg][w]}</td>
        <td>${GUA[g[w]].sym} ${g[w]}</td><td>${GUA[g[w]].bie}</td>
        <td>${WUXING[g[w]]||'<span class="zhu">未定</span>'}</td><td>${FANG[g[w]]}</td>
        <td class="${k&&!isJi(k)?'zhu':'ok'}">${k||"—"}${bu?T_BU:""}</td></tr>`;
  });
  h+=`</table><small>乾坤五行原書未給，四說並存，本引擎不代擬。</small></div>`;

  // 二、四季合議
  const jc=jiCount(g,s);
  h+=`<div class="card"><h3 style="margin-top:0">四季吉凶合議</h3>`;
  if(jc.non.length) h+=`<p><small>乾坤不入四季表，故本盤 ${jc.non.length} 位不參與合議。</small></p>`;
  if(jc.ji.length===3&&jc.xiong.length===1) h+=`<div class="hit"><b>三吉同兇</b><span class="why">${jc.ji.map(x=>x.g).join("")} 吉／${jc.xiong[0].g} 凶</span></div>`;
  if(jc.xiong.length===3&&jc.ji.length===1) h+=`<div class="hit"><b>三兇同吉</b><span class="why">${jc.xiong.map(x=>x.g).join("")} 凶／${jc.ji[0].g} 吉</span></div>`;
  if((jc.ji.length===3&&jc.xiong.length===1)||(jc.xiong.length===3&&jc.ji.length===1)){
    const eh=RULES.find(r=>r.id==="惡爻居之").fn(g,state);
    h+=`<div class="hit"><b>${eh.ok?"惡爻居之 → 今焉死":"待死"}</b><span class="why">${eh.why}　（第一節〈死生〉）</span></div>`;
  }
  if(jc.ji.length!==3&&jc.xiong.length!==3) h+=`<p><small>非三一之局，第一節所舉諸例不適用。</small></p>`;
  h+=`</div>`;

  // 三、判準
  h+=`<div class="card"><h3 style="margin-top:0">判準</h3>`;
  ["卦身","位置","爻位"].forEach(c=>{
    h+=`<h3>${c}</h3>`;
    RULES.filter(r=>r.cls===c).forEach(r=>{
      const v=r.fn(g,state);
      h+=`<div class="hit ${v.ok?"":"no"}"><b>${v.ok?"◉":"○"} ${r.id}</b><span class="why">${v.why}</span></div>`;
    });
  });
  h+=`<div class="hit no"><b>○ 昭穆</b><span class="why">四位依長幼先後內外之次序排列。${T_WEI} 原書未給可判之式，不代擬。</span></div>`;
  h+=`<div class="hit no"><b>○ 當日・當辰・遂日</b><span class="why">須輸入筮問之日干支，v0.1 未收。</span></div></div>`;

  // 四、爻象
  const es=[]; WEI.forEach(w=>state[w].forEach((n,i)=>{if(E.has(n))es.push({w,i,n});}));
  h+=`<div class="card"><h3 style="margin-top:0">爻象（第二十九節）</h3>`;
  if(!es.length) h+=`<p><small>四位皆常爻（六・七），無爻象可取。〈爻象〉〈祟〉二節只論四五八九。</small></p>`;
  else es.forEach(x=>{
    const y=YAOXIANG[x.n];
    let extra="";
    if(x.n===8) extra=x.i===2?`　在上為 ${y.shang}`:(x.i===0?`　在下為 ${y.xia}`:"");
    h+=`<div class="hit"><b>${x.w}・${["下","中","上"][x.i]}爻 ${NUMCH[x.n]}</b><span class="why">為 ${y.xiang.join("、")}${extra}</span></div>`;
  });
  h+=`</div>`;

  // 五、祟
  if(m==="祟"){
    h+=`<div class="card"><h3 style="margin-top:0">祟（第二十六節）</h3>`;
    WEI.forEach(w=>{
      const gg=g[w], ys=state[w], list=SUI[gg]||[];
      const pure=ys.every(n=>n===ys[0]);
      const hits=list.filter(([cond])=>{
        if(cond==="恆")return true;
        if(cond==="純")return pure;
        if(cond==="莫純")return !pure;
        if(cond==="殽")return ys.includes(5)&&ys.includes(9);
        if(cond==="一四一五")return ys.includes(4)&&ys.includes(5);
        if(cond==="二五夾四")return ys[0]===5&&ys[2]===5&&ys[1]===4;
        return ys.includes(+({"四":4,"五":5,"八":8,"九":9})[cond]);
      });
      if(hits.length) h+=`<div class="hit"><b>${w}　${gg}祟</b><span class="why">${hits.map(([c,v])=>`${c}：${v}`).join("；")}</span></div>`;
    });
    h+=`<small>${SUI_FU}</small></div>`;
  }

  // 六、干支
  h+=`<div class="card"><h3 style="margin-top:0">四位所繫干支</h3><table><tr><th>位</th><th>卦</th><th>天干</th><th>地支</th></tr>`;
  WEI.forEach(w=>h+=`<tr><td>${w}</td><td>${g[w]}</td><td>${GAN[g[w]].join("・")}</td>
    <td>${(ZHI_GUA[g[w]]||["—"]).join("・")}</td></tr>`);
  h+=`</table><small>乾坤不納地支（整理者：此表亦不計乾、坤）。</small></div>`;

  h+=`<p><small>本引擎只列落點與判準之成立與否，不代為合判、不下總斷。<b>規則層尚未經卦例回驗</b>——五十七卦例之十二筮數未取得。</small></p>`;
  document.getElementById("out").innerHTML=h;
}

  t(37,LIE.length===JIE.reduce((a,x)=>a+x[2],0),"卦例空殼數與分節表相符");
  t(38,LIE.filter(x=>x.yao===null).length===LIE.length-2,"除已得之二例外，卦例筮數皆空（不得虛構）");
  t(39,RULES.length>=14,"判準條數");
  t(40,RULES.filter(r=>r.cls==="爻位").length>=5,"爻位類判準不少於五條");
  const g0=pos({"左上":[7,7,7],"右上":[6,6,6],"左下":[7,7,7],"右下":[6,6,6]});
  t(41,RULES.find(r=>r.id==="相見在上").fn(g0).ok===true,"乾坤在上為相見在上");
  t(42,PAIR["勞"]==="羅"&&PAIR["艮"]==="兌","配偶對：勞羅・艮兌");
  t(43,SIZHENG.has("震")&&SIZHENG.has("兌")&&!SIZHENG.has("乾"),"四正卦為震羅勞兌");
  t(44,LEFT.size===4&&RIGHT.size===4&&[...LEFT].every(x=>!RIGHT.has(x)),"左右各四卦，不重疊");
  const filled=LIE.filter(x=>x.yao);
  t(45,filled.length===2,"已填入之卦例二例");
  t(46,filled.every(x=>WEI.every(w=>guaOf(x.yao[w])===x.gua[w])),"卦例回驗：所推四位卦名與集釋全同（2/2）");
  t(47,guaOf(LIE[0].yao["左上"])==="巽"&&guaOf(LIE[0].yao["左下"])==="羅","第一節例一：左上巽・左下羅（離）");
  t(48,guaOf(LIE[1].yao["右上"])==="艮","第一節例二：右上艮");
  t(49,Object.keys(GUA)[0]==="乾"&&Object.keys(GUA)[2]==="艮"&&Object.keys(GUA)[3]==="兌","卦序依原書（乾坤艮兌…）");
  t(50,Math.abs((TALLY[6].reduce((a,b)=>a+b,0)+TALLY[7].reduce((a,b)=>a+b,0))/684-0.923)<0.005,"六七合計約 92%（與劉光勝所記相符）");

  const pass=R.filter(x=>x.ok).length;
  document.getElementById("selfout").innerHTML=`<h2>自檢</h2>
   <p><b class="${pass===R.length?"ok":"bad"}">${pass} / ${R.length} 通過</b>　
   <small>自檢項數變動須說明理由——防呆用。</small></p>
   <table><tr><th>№</th><th>結果</th><th class="l">項目</th></tr>`+
   R.map(x=>`<tr><td class="mono">${x.n}</td><td class="${x.ok?"ok":"bad"}">${x.ok?"過":"不過"}</td><td class="l">${x.d}</td></tr>`).join("")+
   `</table>`;
}
